version: '3.8'

services:
  finance-db:
    image: postgres:15.2
    container_name: personal_finance_db
    restart: always
    environment:
      - POSTGRES_DB=personal_finance_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=hkG4563
    ports:
      - "5435:5432"
    volumes:
      - finance_db_data:/var/lib/postgresql/data
    networks:
      - backend

  finance-db-test:
    image: postgres:15.2
    container_name: personal_finance_db_test
    restart: always
    environment:
      - POSTGRES_DB=personal_finance_db_test
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5436:5432"
    volumes:
      - finance_db_test_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  finance_db_data:
  finance_db_test_data:

networks:
  backend:
    driver: bridge
