# ===============================================
#  STAGING SETTINGS (HML)
# ===============================================

# --- Database (Points to a Staging/QA server - REPLACE WITH REAL DATA) ---
spring.datasource.url=jdbc:postgresql://db-hml.your-company.com:5432/finance_hml_db
spring.datasource.username=user_hml
spring.datasource.password=secure-hml-password

# --- Connection Pool (More robust configuration) ---
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.max-lifetime=1800000

# --- JPA/Hibernate (Only validates the schema, does not alter it) ---
spring.jpa.hibernate.ddl-auto=validate

# --- Logging (Less detailed than DEV) ---
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN