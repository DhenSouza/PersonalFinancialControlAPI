# ===============================================
#  PRODUCTION SETTINGS (PROD)
# ===============================================

# --- Database (Points to the Production server - REPLACE WITH REAL DATA) ---
spring.datasource.url=jdbc:postgresql://db-prod.your-company.com:5432/finance_prod_db
spring.datasource.username=user_prod
spring.datasource.password=${DB_PROD_PASSWORD} # Loaded from an environment variable

# --- Connection Pool (High performance configuration) ---
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.max-lifetime=1800000

# --- JPA/Hibernate (Does nothing with the schema, maximum security) ---
spring.jpa.hibernate.ddl-auto=validate

# --- Logging (Only essential information and errors) ---
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR