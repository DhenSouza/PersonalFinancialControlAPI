# ===============================================
#  TESTING ENVIRONMENT SETTINGS (TEST)
# ===============================================

# --- Database (Points to the dedicated test container) ---
spring.datasource.url=jdbc:postgresql://localhost:5436/personal_finance_db_test
spring.datasource.username=admin
spring.datasource.password=admin

# --- JPA/Hibernate (Validates the schema against entities after Flyway runs) ---
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ---
# This property allows Flyway's 'clean' command to be used, which is often
# helpful in testing scenarios to ensure a fresh database state.
# Disabling this is a safety feature for production, so we enable cleaning for tests.
spring.flyway.clean-disabled=false


# --- Logging (Keep logs quiet unless debugging a specific test) ---
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=INFO